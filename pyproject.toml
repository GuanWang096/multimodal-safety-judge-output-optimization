[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-safety-judge-output-optimization"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11.1,<12",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "cryptography>=44",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.urls]
Repository = "https://github.com/GuanWang096/multimodal-safety-judge-output-optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/multijudge_workflows/tests"]
pythonpath = ["src"]
